spring.application.name=soccer-platform

# Override these placeholders with environment variables on your machine.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soccer_platform}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Convenient for early local development. Replace with versioned migrations later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

api-football.base-url=https://v3.football.api-sports.io
api-football.key=${API_FOOTBALL_KEY:}
api-football.leagues[0].external-id=39
api-football.leagues[0].name=Premier League
api-football.leagues[1].external-id=140
api-football.leagues[1].name=La Liga
api-football.leagues[2].external-id=78
api-football.leagues[2].name=Bundesliga
api-football.leagues[3].external-id=135
api-football.leagues[3].name=Serie A
api-football.leagues[4].external-id=61
api-football.leagues[4].name=Ligue 1
