spring.application.name=soccer-platform
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}

# PostgreSQL is the application database. Docker Compose supplies these values.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:soccer_platform}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway creates and evolves the schema; Hibernate only checks entity compatibility.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
app.cache.match-ttl=${MATCH_CACHE_TTL:45s}

soccer.sync.enabled=${SOCCER_SYNC_ENABLED:false}
soccer.sync.interval=${SOCCER_SYNC_INTERVAL:PT1H}
soccer.sync.initial-delay=${SOCCER_SYNC_INITIAL_DELAY:PT1M}
soccer.sync.active-start-utc=${SOCCER_SYNC_START_UTC:10:00}
soccer.sync.active-end-utc=${SOCCER_SYNC_END_UTC:23:59}

api-football.base-url=https://v3.football.api-sports.io
api-football.key=${API_FOOTBALL_KEY:}
api-football.leagues[0].external-id=39
api-football.leagues[0].name=Premier League
api-football.leagues[1].external-id=140
api-football.leagues[1].name=La Liga
api-football.leagues[2].external-id=78
api-football.leagues[2].name=Bundesliga
api-football.leagues[3].external-id=135
api-football.leagues[3].name=Serie A
api-football.leagues[4].external-id=61
api-football.leagues[4].name=Ligue 1
