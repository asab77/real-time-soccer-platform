spring.datasource.url=jdbc:h2:mem:soccer_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app.demo-data.enabled=false
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.open-in-view=false

spring.cache.type=simple
spring.data.redis.repositories.enabled=false
app.cache.match-ttl=45s
soccer.sync.enabled=false
soccer.data.provider=football-data

football.data.base-url=https://api.football-data.org/v4
football.data.api-key=
football.data.competitions[0].code=PL
football.data.competitions[0].name=Premier League
football.data.competitions[1].code=PD
football.data.competitions[1].name=La Liga
football.data.competitions[2].code=BL1
football.data.competitions[2].name=Bundesliga
football.data.competitions[3].code=SA
football.data.competitions[3].name=Serie A
football.data.competitions[4].code=FL1
football.data.competitions[4].name=Ligue 1
